---
- name: Build Kodi on Linux (Ansible)
  hosts: your_target
  become: yes
  vars:
    build_user: "{{ ansible_user | default('ubuntu') }}"
    build_home: "/home/{{ build_user }}"
    kodi_src_dir: "{{ build_home }}/kodi"
    kodi_build_dir: "{{ build_home }}/kodi-build"
    kodi_staging_dir: "{{ build_home }}/package-root"
    cmake_install_prefix: /usr/local

  tasks:
    - name: Ensure required apt packages
      apt:
        name:
          - software-properties-common
          - ccache
          - doxygen
          - libcap-dev
          - libsndio-dev
          - libmariadbd-dev
          - libglew-dev
          - libwayland-dev
          - libxkbcommon-dev
          - waylandpp-dev
          - wayland-protocols
          - libgbm-dev
          - libinput-dev
          - autoconf
          - automake
          - autopoint
          - gettext
          - autotools-dev
          - cmake
          - curl
          - default-jre
          - gawk
          - gcc
          - g++
          - cpp
          - libflatbuffers-dev
          - gdc
          - git
          - libasound2-dev
          - libavahi-client-dev
          - libavcodec-dev
          - libavfilter-dev
          - libavformat-dev
          - libavutil-dev
          - libbluray-dev
          - libbz2-dev
          - libcdio-dev
          - libcec-dev
          - libcrossguid-dev
          - libcurl4-openssl-dev
          - libdbus-1-dev
          - libdrm-dev
          - libegl1-mesa-dev
          - libenca-dev
          - libfmt-dev
          - libfreetype6-dev
          - libfribidi-dev
          - libgcrypt20-dev
          - libgif-dev
          - libiso9660-dev
          - libjpeg-dev
          - liblcms2-dev
          - liblirc-dev
          - libltdl-dev
          - libmicrohttpd-dev
          - libmodplug-dev
          - libmp3lame-dev
          - libmpeg2-4-dev
          - libmysqlclient-dev
          - libnfs-dev
          - libogg-dev
          - libp8-platform-dev
          - libplist-dev
          - libpng-dev
          - libpulse-dev
          - libsamplerate0-dev
          - libsmbclient-dev
          - libspdlog-dev
          - libsqlite3-dev
          - libssl-dev
          - libswscale-dev
          - libtag1-dev
          - libtiff-dev
          - libtinyxml-dev
          - libtool
          - libudev-dev
          - libusb-1.0-0-dev
          - libva-dev
          - libvdpau-dev
          - libvorbis-dev
          - libxkbcommon-dev
          - libxmu-dev
          - libxrandr-dev
          - libxslt1-dev
          - libxt-dev
          - python3-dev
          - rapidjson-dev
          - uuid-dev
          - scons
          - zlib1g-dev
        update_cache: yes

    - name: Add Kodi Nightly PPA
      apt_repository:
        repo: ppa:team-xbmc/xbmc-nightly
        state: present

    - name: Get build dependencies automatically
      apt:
        name: kodi
        state: build-dep

    - name: Clone Kodi repository
      git:
        repo: 'https://github.com/xbmc/xbmc.git'
        dest: "{{ kodi_src_dir }}"
        version: "{{ checkout_branch | default('Omega') }}"  # Set your branch as needed
        force: yes

    - name: Ensure out-of-source build directory exists
      file:
        path: "{{ kodi_build_dir }}"
        state: directory
        owner: "{{ build_user }}"
        mode: '0755'

    - name: Configure Kodi (X11 platform)
      shell: |
        cmake "{{ kodi_src_dir }}" \
          -DCMAKE_INSTALL_PREFIX={{ cmake_install_prefix }} \
          -DCORE_PLATFORM_NAME=x11 \
          -DAPP_RENDER_SYSTEM=gl
      args:
        chdir: "{{ kodi_build_dir }}"
      environment:
        HOME: "{{ build_home }}"
      become: false

    - name: Extract Kodi version from version.txt
      shell: |
        VERSION_MAJOR=$(grep '^VERSION_MAJOR' {{ kodi_src_dir }}/version.txt | awk '{print $2}')
        VERSION_MINOR=$(grep '^VERSION_MINOR' {{ kodi_src_dir }}/version.txt | awk '{print $2}')
        VERSION_TAG=$(grep '^VERSION_TAG' {{ kodi_src_dir }}/version.txt | awk '{print $2}')
        if [ -n "$VERSION_TAG" ]; then
          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}-$VERSION_TAG"
        else
          VERSION="${VERSION_MAJOR}.${VERSION_MINOR}"
        fi
        echo $VERSION
      register: kodi_version_output
      changed_when: false

    - name: Set fact for deb version
      set_fact:
        kodi_deb_version: "{{ kodi_version_output.stdout }}"

    - name: Build Kodi
      shell: cmake --build . -- VERBOSE=1 -j$(nproc)
      args:
        chdir: "{{ kodi_build_dir }}"
      environment:
        HOME: "{{ build_home }}"
      become: false

    - name: Install Kodi to staging directory
      shell: |
        mkdir -p "{{ kodi_staging_dir }}/usr/local"
        make DESTDIR="{{ kodi_staging_dir }}" install
      args:
        chdir: "{{ kodi_build_dir }}"
      environment:
        HOME: "{{ build_home }}"
      become: false

    - name: Create DEBIAN control directory
      file:
        path: "{{ kodi_staging_dir }}/DEBIAN"
        state: directory

    - name: Create DEBIAN control file
      copy:
        dest: "{{ kodi_staging_dir }}/DEBIAN/control"
        content: |
          Package: kodi
          Version: {{ kodi_deb_version }}
          Section: misc
          Priority: optional
          Architecture: amd64
          Depends: libavcodec58, libavformat58, libswscale5
          Maintainer: Pippo8291 <your@email.com>
          Description: Kodi media center (built from Ansible CI)

    - name: Build .deb package
      shell: |
        dpkg-deb --build "{{ kodi_staging_dir }}" "{{ build_home }}/kodi_{{ kodi_deb_version }}_amd64.deb"

    - name: Show resulting .deb path
      shell: "ls -l {{ build_home }}/kodi_{{ kodi_deb_version }}_amd64.deb"
      register: list_deb
      ignore_errors: yes

    - name: Debug deb path
      debug:
        msg: "{{ list_deb.stdout_lines }}"
